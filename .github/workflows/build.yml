name: ClashAI APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/clashai-autoplay-rebuild

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare arena detector model
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics onnx
          curl -L --fail --retry 3 \
            "https://huggingface.co/SudhishNeel/clash-royale-detector/resolve/main/v10/best.pt" \
            -o best.pt
          echo "d0e19e806a834719a4e51f7405641048549e3c2871887306e51b21dde37b3ae2  best.pt" | sha256sum -c -
          python tools/export_yolo.py
          mkdir -p app/src/main/assets
          cp best.onnx app/src/main/assets/clash_yolo.onnx
          cp classes.json app/src/main/assets/clash_classes.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and build APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClashAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
