name: ClashAI APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, feature/live-ai-pipeline]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Download verified YOLO weights
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics onnx
          curl -L --fail --retry 3 "https://huggingface.co/SudhishNeel/clash-royale-detector/resolve/main/v10/best.pt" -o best.pt
          echo "d0e19e806a834719a4e51f7405641048549e3c2871887306e51b21dde37b3ae2  best.pt" | sha256sum -c -
          python tools/export_yolo.py
          mkdir -p app/src/main/assets
          cp best.onnx app/src/main/assets/best.onnx
      - name: Package card reference images
        run: |
          mkdir -p app/src/main/assets/card_templates
          curl -L --fail --retry 3 https://codeload.github.com/jeromewir/clash-royale-assets/tar.gz/refs/heads/master -o card-assets.tar.gz
          tar -xzf card-assets.tar.gz --strip-components=1 --wildcards '*/images/cards/*.png' '*/LICENSE'
          cp images/cards/*.png app/src/main/assets/card_templates/
          cp LICENSE app/src/main/assets/card_templates/LICENSE.txt
          test "$(find app/src/main/assets/card_templates -maxdepth 1 -name '*.png' | wc -l)" -ge 80
          echo "Packaged $(find app/src/main/assets/card_templates -maxdepth 1 -name '*.png' | wc -l) card templates"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClashAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
