name: Build separate Vision Agent APK
on:
  workflow_dispatch:
  push:
    branches: [feature/splitscreen-agent, feature/firstlight-models]
    paths: ['agent-app/**', '.github/workflows/build-agent.yml']
env:
  OMP_NUM_THREADS: "2"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: Jaasssoooonnnnn/FL-Royale
          ref: cf16ef1759f465d74f1797c5e92fe3d939bbb4fc
          path: vendor/fl
      - uses: actions/checkout@v4
        with:
          repository: Jaasssoooonnnnn/FirstLight_CR
          ref: 4c82496ad5af49a3c7ea2392f26ff7bac33d9707
          path: vendor/firstlight
      - uses: actions/checkout@v4
        with:
          repository: youssofal/Clash-Commander
          ref: d627a26f5b6ac2d0c85f7b4a3cd25da9cceb0cc2
          path: vendor/commander
          sparse-checkout: |
            LICENSE
            app/src/main/assets/card_classifier.ptl
            app/src/main/assets/card_classes.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install policy exporter
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r vendor/fl/requirements-build.txt
      - name: Verify and prepare all five policies
        run: python agent-app/prepare_firstlight.py vendor/fl vendor/firstlight
      - name: Verify and prepare the card classifier
        run: python agent-app/prepare_hand.py vendor/commander vendor/fl/assets/screenshots/hog-expert-battle.png
      - run: gradle -p agent-app :app:assembleDebug --stacktrace
