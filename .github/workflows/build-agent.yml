name: Build separate Vision Agent APK
on:
  workflow_dispatch:
  push:
    branches: [feature/splitscreen-agent]
    paths: ['agent-app/**', '.github/workflows/build-agent.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p agent-app :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: clash-vision-agent-debug
          path: agent-app/app/build/outputs/apk/debug/*.apk
